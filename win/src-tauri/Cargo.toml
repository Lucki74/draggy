[package]
name = "draggy-win"
version = "3.0.5"
description = "Draggy for Windows: Tauri shell around the React renderer"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Standalone on purpose: core/ keeps its own workspace and lockfile.
[workspace]

[lib]
name = "draggy_win"
crate-type = ["rlib"]

[[bin]]
name = "draggy-win"
path = "src/main.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
draggy-diagnostics = { path = "../../core/crates/diagnostics" }
draggy-documents = { path = "../../core/crates/documents" }
draggy-web = { path = "../../core/crates/web" }
draggy-storage = { path = "../../core/crates/storage" }
draggy-tools = { path = "../../core/crates/tools" }
getrandom = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
trash = "5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
