<div class="download-action">
  <div class="download-row">
    <div class="os-btn-group" data-os-match="windows">
      <a class="btn btn-primary" href="{{r:windows-exe.url}}">
        <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
        <span>{{t:hero.downloadFor}} Windows</span>
      </a>
      <span class="file-meta">{{meta:windows-exe}}</span>
    </div>
    <div class="os-btn-group" data-os-match="macos">
      <a class="btn btn-primary" href="https://github.com/Lucki74/draggy/releases/tag/{{r:tag}}">
        <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
        <span>{{t:hero.downloadFor}} macOS</span>
      </a>
      <span class="file-meta">Apple silicon (.zip)</span>
    </div>
    <div class="os-btn-group" data-os-match="linux">
      <a class="btn btn-primary" href="https://github.com/Lucki74/draggy/releases/tag/{{r:tag}}">
        <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
        <span>{{t:hero.downloadFor}} Linux</span>
      </a>
      <span class="file-meta">.deb · .rpm</span>
    </div>
    <div class="os-btn-group" data-os-match="mobile">
      <span class="file-meta">{{t:hero.desktopOnly}}</span>
      <button class="btn btn-primary" type="button" data-share-link>
        <svg class="icon" aria-hidden="true"><use href="#i-copy" /></svg>
        <span>{{t:hero.copyLink}}</span>
      </button>
    </div>
    <div class="os-btn-group" data-os-fallback>
      <a class="btn btn-primary" href="{{r:windows-exe.url}}">
        <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
        <span>{{t:hero.downloadFor}} {{t:hero.anySystem}}</span>
      </a>
      <span class="file-meta">{{meta:windows-exe}}</span>
    </div>
  </div>
</div>
