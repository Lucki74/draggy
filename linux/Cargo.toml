[package]
name = "draggy-linux"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.92"
description = "Draggy for Linux: a GTK 4 and libadwaita shell over the shared Rust core"

# A standalone crate, outside the `core/` workspace, so the core's CI and its dependency policy never need GTK.
[workspace]

[lib]
name = "draggy_linux"
path = "src/lib.rs"

[[bin]]
name = "draggy"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
collapsible_if = "allow"

[dependencies]
draggy-core = { path = "../core/crates/draggy-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "rt"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webkit6 = "0.6"

[build-dependencies]
glib-build-tools = "0.22"

[package.metadata.deb]
name = "draggy"
maintainer = "Draggy"
section = "utils"
priority = "optional"
depends = "$auto, libgtk-4-1, libadwaita-1-0, libwebkitgtk-6.0-4"
assets = [
    ["target/release/draggy", "usr/bin/", "755"],
    ["data/com.draggy.Draggy.desktop", "usr/share/applications/", "644"],
    ["data/com.draggy.Draggy.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/512x512/apps/com.draggy.Draggy.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "draggy"
summary = "Local chat with tools and a built-in browser"
license = "Apache-2.0"
assets = [
    { source = "target/release/draggy", dest = "/usr/bin/draggy", mode = "755" },
    { source = "data/com.draggy.Draggy.desktop", dest = "/usr/share/applications/com.draggy.Draggy.desktop", mode = "644" },
    { source = "data/com.draggy.Draggy.metainfo.xml", dest = "/usr/share/metainfo/com.draggy.Draggy.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/512x512/apps/com.draggy.Draggy.png", dest = "/usr/share/icons/hicolor/512x512/apps/com.draggy.Draggy.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
"webkitgtk6.0" = "*"
