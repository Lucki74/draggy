[package]
name = "draggy-documents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The 0.4.22 release still pins zip 8; this upstream commit moves to the patched zip 9.0.5.
docx-rs = { git = "https://github.com/bokuweb/docx-rs", rev = "3b959fa73e6ea78a3c96ab50416407b2c3b8fa7a", default-features = false }
lopdf = { version = "0.45", default-features = false }
regex = "1"
rust_xlsxwriter = "0.102"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
draggy-testkit = { path = "../testkit" }
serde_json = "1"
