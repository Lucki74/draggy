[package]
name = "draggy-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
draggy-providers = { path = "../providers" }
fancy-regex = "0.19"
# Keeps object keys in insertion order, as JavaScript does, so re-serialised tool calls read the same.
serde = { version = "1", features = ["derive"] }
# Parses floats exactly, so a golden fixture number reads back as the same double the reference wrote.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
draggy-testkit = { path = "../testkit" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
