# Licence and advisory policy for the Rust core, checked by `cargo deny check` in core.yml.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# docx-rs 0.4.22 (the latest release) pins zip 8, which these three advisories cover. They concern
# ZipArchive::extract and ZipStreamReader::extract. Neither docx-rs nor draggy-documents calls those, and nothing
# unpacks an archive to disk. Drop these once docx-rs moves to zip 9.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip extract only; docx-rs 0.4.22 pins zip 8 and does not extract to disk" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract only; docx-rs 0.4.22 pins zip 8 and does not extract to disk" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract only; docx-rs 0.4.22 pins zip 8 and does not extract to disk" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
