version: 2
updates:
  - package-ecosystem: npm
    directory: /win
    schedule:
      interval: weekly
    # Only versions out for a week, so a hijacked release has time to be caught and pulled.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
