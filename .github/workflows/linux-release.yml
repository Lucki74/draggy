name: Linux package

# Builds the .deb for the native Linux app and keeps it as a workflow artifact. Run it by hand; it publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: Build the .deb
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: linux

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev blueprint-compiler

      - run: rustup toolchain install stable --profile minimal

      - run: cargo install cargo-deb --locked --version 3.6.0

      - run: cargo deb --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draggy-deb
          path: linux/target/debian/*.deb
          if-no-files-found: error
