name: CI

# Typecheck, lint and the full test suite on every OS Draggy ships for.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: win
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release workflow builds on the same Node version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: win/.nvmrc
          cache: npm
          cache-dependency-path: win/package-lock.json

      - run: npm ci

      - run: npm run check
