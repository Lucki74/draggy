name: CI

# Typecheck, lint, the full test suite and the Rust checks for the Tauri app on Windows, and the Rust checks on Linux and macOS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test and Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release workflow builds on the same Node version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust with rustfmt and clippy
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri

      - run: npm ci

      - name: Test and build the sandbox launcher
        working-directory: app/sandbox
        run: cargo test -q && cargo build --release

      # vendor/ is git-ignored, so the pinned node.exe sidecar is fetched and checked against app/scripts/node-pin.json.
      - name: Fetch the pinned node.exe sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -Raw scripts/node-pin.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path vendor/node | Out-Null
          $dest = Join-Path $PWD 'vendor/node/node.exe'
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$($pin.version)/win-x64/node.exe" -OutFile $dest
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLowerInvariant()
          if ($hash -ne $pin.sha256) { throw "node.exe sha256 $hash does not match pin $($pin.version)" }

      - name: Fetch the pinned ffmpeg and ffprobe sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -Raw scripts/ffmpeg-pin.json | ConvertFrom-Json
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $pin.source -OutFile $zip
          $out = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg | Out-Null
          foreach ($tool in 'ffmpeg', 'ffprobe') {
            $found = Get-ChildItem -Path $out -Recurse -Filter "$tool.exe" | Select-Object -First 1
            if (-not $found) { throw "$tool.exe missing from $($pin.source)" }
            $dest = Join-Path $PWD "vendor/ffmpeg/$tool.exe"
            Copy-Item -LiteralPath $found.FullName -Destination $dest -Force
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLowerInvariant()
            if ($hash -ne $pin.$tool.sha256) { throw "$tool.exe sha256 $hash does not match pin $($pin.version)" }
          }

      - run: npm run stage:sidecars

      - run: npm run check

      # Tauri's frontendDist must exist before cargo builds the crate.
      - run: npm run build

      - name: Rust format
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test -q

  # The same Rust checks on Linux and macOS, so code behind cfg(not(windows)) compiles and stays free of dead code.
  unix:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            pin: scripts/node-pin-linux.json
            stage: scripts/stage-sidecars-linux.sh
          - os: macos-15
            pin: scripts/node-pin-macos.json
            stage: scripts/stage-sidecars-mac.sh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust with rustfmt and clippy
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri

      - run: npm ci

      # vendor/ is git-ignored, so the pinned node is fetched and checked against the platform's node pin.
      # cargo only checks that ffmpeg and ffprobe exist, so empty files stand in for them.
      - name: Stage the sidecars
        env:
          PIN: ${{ matrix.pin }}
          STAGE: ${{ matrix.stage }}
        run: |
          version="$(node -p "require('./$PIN').version")"
          archive="$(node -p "require('./$PIN').archive")"
          expected="$(node -p "require('./$PIN').archiveSha256")"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://nodejs.org/dist/$version/$archive"
          echo "$expected  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          mkdir -p vendor/node vendor/ffmpeg
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/${archive%.tar.*}/bin/node" vendor/node/node
          cp -R "$RUNNER_TEMP/${archive%.tar.*}/lib/node_modules/npm" vendor/node/npm
          touch vendor/ffmpeg/ffmpeg vendor/ffmpeg/ffprobe
          TAURI_ENV_DEBUG=true bash "$STAGE"

      # Tauri's frontendDist must exist before cargo builds the crate.
      - run: npm run build

      - name: Rust format
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test -q
