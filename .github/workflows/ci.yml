name: CI

# The test suite is fast enough that there is no reason not to run it on every
# push: 693 tests in under three seconds. Until this existed, `npm run check`
# on a contributor's own machine was the only thing between a mistake and main,
# and nothing verified that it had been run.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Two pushes to the same branch in quick succession only need the newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 is what the release workflow builds with. Checking on the same
      # version is the point; a suite that passes here and fails there would
      # tell us nothing useful.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check
