name: Release

# Run from the Actions tab on main. Builds Windows, macOS and Linux as 3.0.N, where N is one more than
# the highest b-N tag, then publishes a release named build-N with the installers and the
# latest*.yml files the in-app updater reads. The native macOS zip and the Linux .deb and .rpm
# ride along in the same release.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes in Markdown, without the Full Changelog line
        required: true
        type: string
      dry_run:
        description: Build everything but do not publish
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      n: ${{ steps.next.outputs.n }}
    steps:
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/b-" --jq '.[].ref' \
            | sed -n 's#^refs/tags/b-\([0-9]\+\)$#\1#p' | sort -n | tail -1)
          echo "n=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: win/.nvmrc
          cache: npm
          cache-dependency-path: win/package-lock.json

      - run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: win/src-tauri

      - run: npm ci

      # vendor/ is git-ignored, so the pinned node.exe sidecar and embeddable Python are fetched here.
      - name: Fetch the pinned node.exe sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -Raw scripts/node-pin.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path vendor/node | Out-Null
          $dest = Join-Path $PWD 'vendor/node/node.exe'
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$($pin.version)/win-x64/node.exe" -OutFile $dest
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLowerInvariant()
          if ($hash -ne $pin.sha256) { throw "node.exe sha256 $hash does not match pin $($pin.version)" }

      - run: npm run fetch:python

      - run: npm run stage:sidecars

      - name: Typecheck, lint and test
        run: npm run check

      # The notes reach the shell only through env, so their text never runs as code.
      - name: Set the version and write the notes
        shell: bash
        env:
          N: ${{ needs.prepare.outputs.n }}
          NOTES: ${{ inputs.notes }}
        run: |
          npm version "3.0.$N" --no-git-tag-version --allow-same-version
          printf '%s\n' "$NOTES" > build/release-notes.md

      - name: Build the Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      # Renames the NSIS setup, then writes the Tauri updater feed and the bridge latest.yml the Electron copies read.
      - name: Name the installer and write the update feeds
        shell: pwsh
        env:
          N: ${{ needs.prepare.outputs.n }}
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "3.0.$env:N"
          $nsis = Join-Path $PWD 'src-tauri/target/release/bundle/nsis'
          $setup = Get-ChildItem -LiteralPath $nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "No NSIS setup found in $nsis" }
          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path -LiteralPath $sigPath)) { throw 'No updater signature next to the setup; createUpdaterArtifacts is off' }
          $out = Join-Path $PWD 'dist-tauri'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $installer = Join-Path $out 'draggy_setup.exe'
          Copy-Item -LiteralPath $setup.FullName -Destination $installer
          ./scripts/bridge-latest-yml.ps1 -Setup $installer -Version $version -Out (Join-Path $out 'latest.yml')
          $feed = [ordered]@{
            version   = $version
            notes     = $env:NOTES
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content -Raw -LiteralPath $sigPath).Trim()
                url       = "https://github.com/$env:REPO/releases/download/updater-windows/draggy_setup.exe"
              }
            }
          }
          $json = $feed | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $out 'latest-windows.json'), $json + "`n", (New-Object System.Text.UTF8Encoding $false))

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: win/dist-tauri/*
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup toolchain install stable --profile minimal

      - run: brew install xcodegen

      - run: macos/scripts/build-core.sh

      - run: xcodegen generate
        working-directory: macos

      - name: Test
        run: >
          xcodebuild test
          -project Draggy.xcodeproj
          -scheme Draggy
          -destination "platform=macOS,arch=arm64"
          CODE_SIGNING_ALLOWED=NO
        working-directory: macos

      - name: Build and sign ad hoc
        env:
          N: ${{ needs.prepare.outputs.n }}
        run: >
          xcodebuild build
          -project Draggy.xcodeproj
          -scheme Draggy
          -configuration Release
          -destination "platform=macOS,arch=arm64"
          -derivedDataPath build/derived
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=NO
          MARKETING_VERSION="3.0.$N"
          CURRENT_PROJECT_VERSION="$N"
        working-directory: macos

      - name: Package
        env:
          N: ${{ needs.prepare.outputs.n }}
        run: |
          app="macos/build/derived/Build/Products/Release/Draggy.app"
          codesign --force --deep --sign - --options runtime "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p out
          ditto -c -k --keepParent "$app" "out/Draggy-3.0.$N-macos-arm64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: out/*.zip
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev blueprint-compiler xvfb

      - run: rustup toolchain install stable --profile minimal

      - name: Test
        run: xvfb-run -a cargo test --locked -q

      # The crate version is 0.1.0 in the repository. Cargo.lock follows it, so the packaging below runs without --locked.
      - name: Set the version
        env:
          N: ${{ needs.prepare.outputs.n }}
        run: sed -i '0,/^version = ".*"/s//version = "3.0.'"$N"'"/' Cargo.toml

      - run: cargo install cargo-deb --locked --version 3.6.0

      - run: cargo install cargo-generate-rpm --locked --version 0.20.0

      - run: cargo deb

      - run: cargo build --release

      - run: cargo generate-rpm

      - name: Collect the packages
        run: |
          mkdir -p ../out
          cp target/debian/*.deb target/generate-rpm/*.rpm ../out/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: out/*
          if-no-files-found: error

  # Drafting first and publishing last means a failed upload never leaves a half-empty Latest
  # release that installed apps would pick up.
  publish:
    needs: [prepare, windows, macos, linux]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      # Linux installs read latest-linux.yml from the newest b-N release and error without it.
      # Once builds stop making it, copy it forward from the final cross-platform release.
      - name: Carry the frozen Linux update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/latest-linux.yml ]; then
            echo "latest-linux.yml is in this build; nothing to carry forward"
            exit 0
          fi

          if ! ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/electron-crossplatform-final" \
            --jq '"\(.object.sha) \(.object.type)"'); then
            echo "::error::Could not read tag electron-crossplatform-final, so there is no frozen Linux feed to copy."
            exit 1
          fi
          read -r commit kind <<< "$ref"
          if [ "$kind" = tag ]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$commit" --jq .object.sha)
          fi

          if ! refs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/b-" \
            --jq ".[] | select(.object.sha == \"$commit\") | .ref"); then
            echo "::error::Could not list the b-N tags."
            exit 1
          fi
          n=$(sed -n 's#^refs/tags/b-\([0-9]\+\)$#\1#p' <<< "$refs" | sort -n | tail -1)
          if [ -z "$n" ]; then
            echo "::error::No b-N tag points at electron-crossplatform-final ($commit), so there is no frozen Linux feed to copy."
            exit 1
          fi

          gh release download "b-$n" --repo "$GITHUB_REPOSITORY" --pattern latest-linux.yml --dir out

      # The Tauri feed and installer go to the rolling updater-windows release, so the b-N release keeps only the bridge latest.yml.
      - name: Split out the Windows updater feed
        shell: bash
        run: |
          mkdir -p updater
          mv out/latest-windows.json updater/
          cp out/draggy_setup.exe updater/

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd out
          sha256sum -- $(ls -1 | grep -v '^SHA256SUMS.txt$') > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ needs.prepare.outputs.n }}
          NOTES: ${{ inputs.notes }}
        run: |
          body="$NOTES"
          if [ "$N" -gt 1 ]; then
            body="$body"$'\n\n'"**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/b-$((N-1))...b-$N"
          fi
          gh release create "b-$N" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "build-$N" --notes "$body" --draft
          gh release edit "b-$N" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Publish the Windows updater feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view updater-windows --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create updater-windows --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Windows updater feed" --notes "Rolling feed read by the in-app updater. Replaced on every Windows release." --latest=false
          fi
          gh release upload updater-windows updater/* --repo "$GITHUB_REPOSITORY" --clobber
