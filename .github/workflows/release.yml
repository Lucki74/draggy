name: Release

# Run from the Actions tab on main. Builds Windows, macOS and Linux as 3.0.N, where N is one more
# than the highest b-N tag, then publishes a release named build-N with the installers, the signed
# Tauri updater feeds, the latest*.yml bridge feeds for pre-Tauri installs and SHA256SUMS.txt.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes in Markdown, without the Full Changelog line
        required: true
        type: string
      dry_run:
        description: Build everything but do not publish
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      n: ${{ steps.next.outputs.n }}
    steps:
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/b-" --jq '.[].ref' \
            | sed -n 's#^refs/tags/b-\([0-9]\+\)$#\1#p' | sort -n | tail -1)
          echo "n=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri

      - run: npm ci

      # vendor/ is git-ignored, so the pinned node.exe sidecar and embeddable Python are fetched here.
      - name: Fetch the pinned node.exe sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -Raw scripts/node-pin.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path vendor/node | Out-Null
          $dest = Join-Path $PWD 'vendor/node/node.exe'
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$($pin.version)/win-x64/node.exe" -OutFile $dest
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLowerInvariant()
          if ($hash -ne $pin.sha256) { throw "node.exe sha256 $hash does not match pin $($pin.version)" }

      - name: Fetch the pinned ffmpeg and ffprobe sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -Raw scripts/ffmpeg-pin.json | ConvertFrom-Json
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $pin.source -OutFile $zip
          $out = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg | Out-Null
          foreach ($tool in 'ffmpeg', 'ffprobe') {
            $found = Get-ChildItem -Path $out -Recurse -Filter "$tool.exe" | Select-Object -First 1
            if (-not $found) { throw "$tool.exe missing from $($pin.source)" }
            $dest = Join-Path $PWD "vendor/ffmpeg/$tool.exe"
            Copy-Item -LiteralPath $found.FullName -Destination $dest -Force
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLowerInvariant()
            if ($hash -ne $pin.$tool.sha256) { throw "$tool.exe sha256 $hash does not match pin $($pin.version)" }
          }

      - run: npm run fetch:python

      - run: npm run stage:sidecars

      - name: Typecheck, lint and test
        run: npm run check

      # The notes reach the shell only through env, so their text never runs as code.
      - name: Set the version and write the notes
        shell: bash
        env:
          N: ${{ needs.prepare.outputs.n }}
          NOTES: ${{ inputs.notes }}
        run: |
          npm version "3.0.$N" --no-git-tag-version --allow-same-version
          printf '%s\n' "$NOTES" > build/release-notes.md

      - name: Build the Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      # Renames the NSIS setup, then writes the Tauri updater feed and the bridge latest.yml the Electron copies read.
      - name: Name the installer and write the update feeds
        shell: pwsh
        env:
          N: ${{ needs.prepare.outputs.n }}
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "3.0.$env:N"
          $nsis = Join-Path $PWD 'src-tauri/target/release/bundle/nsis'
          $setup = Get-ChildItem -LiteralPath $nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "No NSIS setup found in $nsis" }
          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path -LiteralPath $sigPath)) { throw 'No updater signature next to the setup; createUpdaterArtifacts is off' }
          $out = Join-Path $PWD 'dist-tauri'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $installer = Join-Path $out 'draggy_setup.exe'
          Copy-Item -LiteralPath $setup.FullName -Destination $installer
          Copy-Item -LiteralPath $sigPath -Destination "$installer.sig"
          node scripts/verify-update-sig.mjs $installer
          if ($LASTEXITCODE -ne 0) { throw 'The setup signature does not match plugins.updater.pubkey' }
          ./scripts/bridge-latest-yml.ps1 -Setup $installer -Version $version -Out (Join-Path $out 'latest.yml')
          $feed = [ordered]@{
            version   = $version
            notes     = $env:NOTES
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content -Raw -LiteralPath $sigPath).Trim()
                url       = "https://github.com/$env:REPO/releases/download/b-$env:N/draggy_setup.exe"
              }
            }
          }
          $json = $feed | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $out 'latest-windows.json'), $json + "`n", (New-Object System.Text.UTF8Encoding $false))

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: app/dist-tauri/*
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri

      - run: npm ci

      # vendor/ is git-ignored, so the pinned node, ffmpeg and ffprobe for both architectures are fetched and checked
      # against node-pin-macos.json and ffmpeg-pin-macos.json. stage-sidecars-mac.sh lipos them during the build.
      - name: Fetch the pinned sidecars
        run: bash scripts/fetch-sidecars-unix.sh mac

      - name: Set the version
        env:
          N: ${{ needs.prepare.outputs.n }}
        run: npm version "3.0.$N" --no-git-tag-version --allow-same-version

      - name: Build the Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.unix.conf.json

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test -q

      # The ad hoc signature changes the bundle, so the updater archive is rebuilt and signed again afterwards.
      - name: Sign ad hoc, package and write the update feed
        env:
          N: ${{ needs.prepare.outputs.n }}
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="3.0.$N"
          bundle="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          app="$bundle/Draggy.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          for bin in "$app"/Contents/MacOS/*; do
            archs="$(lipo -archs "$bin")"
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::$bin is $archs, not universal"; exit 1 ;; esac
          done
          mkdir -p dist-tauri
          ditto -c -k --keepParent "$app" "dist-tauri/Draggy-$version-macos-universal.zip"
          tar -czf "dist-tauri/Draggy-$version-macos-universal.app.tar.gz" -C "$bundle" Draggy.app
          npx tauri signer sign "dist-tauri/Draggy-$version-macos-universal.app.tar.gz"
          node scripts/verify-update-sig.mjs "dist-tauri/Draggy-$version-macos-universal.app.tar.gz"
          base="https://github.com/$REPO/releases/download/b-$N"
          tarball="dist-tauri/Draggy-$version-macos-universal.app.tar.gz"
          node scripts/release-feeds.mjs tauri dist-tauri/latest-macos.json "$version" "$base" \
            "darwin-x86_64=$tarball" "darwin-aarch64=$tarball"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: app/dist-tauri/*
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev file

      - run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri

      - run: npm ci

      # vendor/ is git-ignored, so the pinned node, ffmpeg and ffprobe are fetched and checked against
      # node-pin-linux.json and ffmpeg-pin-linux.json. stage-sidecars-linux.sh copies them during the build.
      - name: Fetch the pinned sidecars
        run: bash scripts/fetch-sidecars-unix.sh linux

      - name: Set the version
        env:
          N: ${{ needs.prepare.outputs.n }}
        run: npm version "3.0.$N" --no-git-tag-version --allow-same-version

      - name: Build the Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's strip cannot read the newer ELF sections on ubuntu-24.04.
          NO_STRIP: "true"
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.unix.conf.json

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test -q

      # Renames the packages to the names draggy.org expects, then writes the Tauri feed and the
      # electron-updater bridge feed that moves Electron Linux installs onto the Tauri packages.
      - name: Name the packages and write the update feeds
        env:
          N: ${{ needs.prepare.outputs.n }}
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          version="3.0.$N"
          bundle="src-tauri/target/release/bundle"
          mkdir -p dist-tauri
          take() {
            local found
            found=$(find "$bundle/$1" -maxdepth 1 -type f -name "$2" | head -1)
            if [ -z "$found" ] || [ ! -f "$found.sig" ]; then
              echo "::error::No $2 with a .sig in $bundle/$1; createUpdaterArtifacts is off or the bundle failed"
              exit 1
            fi
            cp "$found" "dist-tauri/$3"
            cp "$found.sig" "dist-tauri/$3.sig"
          }
          take deb "*_${version}_amd64.deb" "draggy_${version}_amd64.deb"
          take rpm "*-${version}-1.x86_64.rpm" "draggy-${version}-1.x86_64.rpm"
          take appimage "*_${version}_amd64.AppImage" "draggy_${version}_amd64.AppImage"
          node scripts/verify-update-sig.mjs "dist-tauri/draggy_${version}_amd64.AppImage"             "dist-tauri/draggy_${version}_amd64.deb" "dist-tauri/draggy-${version}-1.x86_64.rpm"
          base="https://github.com/$REPO/releases/download/b-$N"
          node scripts/release-feeds.mjs tauri dist-tauri/latest-linux.json "$version" "$base" \
            "linux-x86_64=dist-tauri/draggy_${version}_amd64.AppImage" \
            "linux-x86_64-appimage=dist-tauri/draggy_${version}_amd64.AppImage" \
            "linux-x86_64-deb=dist-tauri/draggy_${version}_amd64.deb" \
            "linux-x86_64-rpm=dist-tauri/draggy-${version}-1.x86_64.rpm"
          node scripts/release-feeds.mjs yml dist-tauri/latest-linux.yml "$version" \
            "dist-tauri/draggy_${version}_amd64.AppImage" \
            "dist-tauri/draggy_${version}_amd64.deb" \
            "dist-tauri/draggy-${version}-1.x86_64.rpm"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: app/dist-tauri/*
          if-no-files-found: error

  # Drafting first and publishing last means a failed upload never leaves a half-empty Latest
  # release that installed apps would pick up.
  publish:
    needs: [prepare, windows, macos, linux]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Check the release files
        shell: bash
        run: |
          cd out
          for file in draggy_setup.exe draggy_setup.exe.sig latest.yml latest-windows.json latest-macos.json \
            latest-linux.json latest-linux.yml; do
            [ -f "$file" ] || { echo "::error::$file is missing"; exit 1; }
          done
          ls -1 | grep -qE '^Draggy-[0-9.]+-macos-universal\.zip$' || { echo "::error::macOS zip is missing"; exit 1; }
          grep -q '^version: ' latest.yml || { echo "::error::latest.yml has no version line"; exit 1; }

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd out
          sha256sum -- $(ls -1 | grep -v '^SHA256SUMS.txt$') > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ needs.prepare.outputs.n }}
          NOTES: ${{ inputs.notes }}
        run: |
          body="$NOTES"
          if [ "$N" -gt 1 ]; then
            body="$body"$'\n\n'"**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/b-$((N-1))...b-$N"
          fi
          gh release create "b-$N" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "build-$N" --notes "$body" --draft
          gh release edit "b-$N" --repo "$GITHUB_REPOSITORY" --draft=false --latest
