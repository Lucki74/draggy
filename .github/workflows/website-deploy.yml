name: Website deploy

# The draggy.org build reads the latest release from GitHub, so a finished Release run redeploys it.
# Pushes deploy through Vercel's Git integration, which skips a site whose folder did not change.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] no checkout, no permissions, only calls the hook
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  redeploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Call the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_WWW }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK_WWW is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
