name: Bug report
description: Something in draggy isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?

  - type: input
    id: version
    attributes:
      label: Draggy build
      description: The build number shown in the app.
      placeholder: "build 16"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS on Apple silicon
        - macOS on Intel
        - Linux (.deb)
        - Linux (.rpm)
        - Linux (AppImage)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 25H2, macOS 15.4 or Ubuntu 24.04

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature area
      options:
        - Chat
        - Code projects
        - Plans and background tasks
        - Browser pane
        - Web search and research
        - Document search
        - Image generation
        - Voice and talk
        - Extensions (MCP and skills)
        - Commands and permissions
        - Cloud providers and sign-in
        - Local models and engines
        - Settings and appearance
        - Installation and updates
        - Other

  - type: input
    id: model
    attributes:
      label: Model used
      description: A local GGUF file or a cloud provider's model.
      placeholder: e.g. Qwen3.6-35B-A3B Q4_K_M

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: CPU / GPU / RAM
      placeholder: e.g. Ryzen 7 7840HS / RTX 4070 8 GB / 32 GB, or M3 Pro 36 GB

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste the relevant lines from app.log, or attach the file from Settings → Diagnostics → Export diagnostics, which hides your home folder and user name. To attach screenshots, drag them into the "What happened?" field above.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: I'm on the latest build
          required: true
